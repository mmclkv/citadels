name: Deploy stable release to GitHub Pages

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable tag to deploy or roll back to (vX.Y.Z)'
        required: true
        type: string

concurrency:
  group: stable-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable stable release
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from python_backend.versioning import ROOT, git, release_commit, require_stable, version_info
          commit = release_commit(ROOT, os.environ['RELEASE_TAG'])
          assert git(ROOT, 'rev-parse', 'HEAD') == commit
          require_stable(version_info())
          PY

      - name: Build site (public/ + src/ + images/ + .nojekyll)
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r public/. _site/
          cp -r src _site/src
          cp -r images _site/images
          touch _site/.nojekyll
          python tools/release.py status > _site/version.json

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
