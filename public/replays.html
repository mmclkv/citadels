<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对局录像 · 富饶之城</title><link rel="stylesheet" href="./replays.css?v=1"></head><body>
<header><a id="home" href="./">← 返回首页</a><h1>对局录像</h1><p>已完成对局 · 全信息回放（可查看手牌与角色）</p></header>
<main><section id="history"><div class="line"><h2>历史录像</h2><button id="refresh">刷新</button></div><p id="list-status" role="status"></p><div id="list"></div><div class="line"><button id="prev-page">上一页</button><span id="page"></span><button id="next-page">下一页</button></div></section>
<section id="player" hidden><div class="line"><h2 id="title"></h2><button id="back">返回列表</button></div><p id="summary"></p><div class="controls"><button id="first">⏮ 开局</button><button id="previous">上一步</button><button id="play">▶ 播放</button><button id="next">下一步</button><button id="last">⏭ 结果</button><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div><input id="seek" type="range" min="0" value="0" aria-label="录像进度"><div class="line"><strong id="phase"></strong><span id="position"></span></div><p id="event" aria-live="polite"></p><div id="effects"></div><div id="pending"></div><div id="board"></div><section><div class="line"><h3>手牌视角</h3><select id="perspective" aria-label="选择查看手牌的玩家"></select></div><div id="hand"></div></section><section><h3>战报（最近 100 条）</h3><ol id="logs"></ol></section></section></main>
<dialog id="card-dialog"><h3 id="card-title"></h3><p id="card-description"></p><button id="close-card">关闭</button></dialog><script src="./replays.js?v=1"></script></body></html>
