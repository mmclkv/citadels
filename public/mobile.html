.viewer{position:absolute;inset:0;z-index:30;background:rgba(1,5,10,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px 14px calc(16px + env(safe-area-inset-bottom));backdrop-filter:blur(5px)}.viewer.show{display:flex}.viewer-head{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));height:44px;display:flex;align-items:center;justify-content:space-between;z-index:2}.viewer-title{font-size:13px;font-weight:850}.viewer-close{width:38px;height:38px;border-radius:11px;border:1px solid #244c6a;background:#0a1928;color:white;font-size:20px}.viewer-card{max-width:min(82vw,340px);max-height:69vh;object-fit:contain;border-radius:10px;box-shadow:0 22px 60px #000,0 0 0 1px #315779;touch-action:pinch-zoom}.viewer-meta{margin-top:10px;width:min(88vw,360px);display:flex;align-items:center;justify-content:center;gap:8px;color:#a9bdcc;font-size:11px;min-height:22px}.viewer-meta .color-dot{width:10px;height:10px;border-radius:50%;background:var(--district-color,#777);box-shadow:0 0 8px var(--district-color,#777)}.viewer-actions{width:min(88vw,360px);display:grid;grid-template-columns:1fr;gap:7px;margin-top:9px}.viewer-actions.two{grid-template-columns:1fr 1fr}
@media(max-width:860px){body{padding:0}.shell{display:block}.note{display:none}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}.phone-wrap{display:block}.district-card{height:96px}.district-card.hand{height:103px}}
/* 大屏 / 横屏：不再保留 430px 手机边框，铺满整个视口宽度 */
@media(min-width:861px){body{padding:0}.shell{max-width:none;margin:0;display:block}.phone-wrap{display:block}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}.city-compact{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}}
@media(max-width:395px){.players{padding-left:3px;padding-right:3px;gap:3px}.player-row{padding:3px;min-height:73px}.player-headline{gap:2px}.pname{font-size:9.9px;max-width:46px}.public-role-btn{font-size:8.8px;padding:0 3px 0 1px;gap:1px}.public-role-btn .role-no{font-size:8.8px}.p-stats{gap:2px}.p-stats .stat-value{font-size:7.6px}.city-compact{gap:1px}.city-mini{padding:0 1px;border-left-width:2px}.mini-name{font-size:9px;letter-spacing:-.6px}.mini-cost{font-size:8.5px}.thumb-grid{grid-template-columns:repeat(5,60px);gap:6px 4px}.small-card-btn{width:60px;height:90px}.summary-role .role-mini-name{font-size:8.6px}}
@media(max-height:760px){.player-row{min-height:70px}.city-mini{height:20px}.district-card{height:83px}.district-card.hand{height:89px}.viewport{padding-bottom:170px}.roles{gap:4px}.bottom{padding-top:4px}.btn{height:41px}}
</style>
<link rel="stylesheet" href="./mobile-live.css?v=31"/>
<link rel="stylesheet" href="./themes/classic/mobile.css?v=4"/>
</head>
<body>
<div class="shell">
  <div class="phone-wrap">
    <main class="phone" id="phone">
      <header class="top">
        <button class="iconbtn" id="menuButton" type="button" aria-label="菜单"><span class="menu-symbol">☰</span><span>菜单</span></button>
        <div class="phase" id="phase">富饶之城<small>霓虹主题</small></div>
        <button class="iconbtn sidebar-toggle" id="sidebarToggle" type="button" aria-label="展开侧边栏" aria-expanded="false" aria-controls="mobileSidebar">‹</button>
      </header>

      <div class="viewport" id="viewport">
        <section class="section">
          <div class="section-title"><strong>公开局面 <span class="badge8" id="playerCount">— 人局</span></strong><span class="sub" id="publicSub">顺时针排列</span></div>
          <div class="effects-banner" id="effectsBanner" hidden></div>
          <div class="players" id="players"></div>
        </section>

        <section class="section fold-section collapsed" id="handSection">
          <div class="section-title">
            <div class="fold-title-left"><strong>我的手牌</strong><span class="sub">0 张</span></div>
            <button class="fold-toggle" type="button" data-fold="handSection">展开</button>
          </div>
          <div class="fold-summary"><div class="fold-summary-grid" id="handSummary"></div></div>
          <div class="fold-expanded"><div class="thumb-grid" id="myHand"></div></div>
        </section>

        <section class="section fold-section role-area" id="roleArea">
          <div class="section-title">
            <div class="fold-title-left"><strong>请选择一个角色</strong><span class="sub">点击卡图查看 / 选择</span></div>
            <button class="fold-toggle" type="button" data-fold="roleArea">收起</button>
          </div>
          <div class="fold-summary"><div class="fold-summary-grid" id="roleSummary"></div></div>
          <div class="fold-expanded"><div class="thumb-grid" id="roles"></div></div>
        </section>

        <section class="section" id="removedArea">
          <div class="section-title"><strong>本轮弃置角色</strong><span class="sub">明置可查看 · 暗置仅牌背</span></div>
          <div class="removed-mobile" id="removedRoles"></div>
        </section>
      </div>

      <div class="sheet-mask" id="mask"></div>
      <section class="sheet" id="sheet">
        <div class="sheet-head"><span id="sheetTitle">玩家详情</span><button class="close" id="closeSheet">×</button></div>
        <div class="sheet-body" id="sheetBody"></div>
      </section>

      <section class="viewer" id="viewer" aria-modal="true" role="dialog">
        <div class="viewer-head"><div class="viewer-title" id="viewerTitle">卡牌</div><button class="viewer-close" id="viewerClose">×</button></div>
        <img class="viewer-card" id="viewerImg" alt="卡牌大图"/>
        <div class="viewer-meta" id="viewerMeta"></div>
        <div class="viewer-actions" id="viewerActions"><button class="btn ghost">返回</button></div>
      </section>

      <footer class="bottom">
        <div class="selected-info" id="selectedInfo">正在连接游戏服务</div>
        <div class="actions one" id="actions"></div>
      </footer>
      <section class="over-overlay" id="overOverlay" hidden><div class="over-card">
        <h2 id="overTitle">游戏结束</h2>
        <div class="over-scroll"><table class="score-table" id="scoreTable"></table></div>
        <div class="btn-row"><button class="btn ghost" id="overExit" type="button">回主菜单</button><button class="btn primary" id="overAgain" type="button">再来一局</button></div>
      </div></section>
      <section class="event-overlay" id="eventOverlay" hidden><div class="event-box" id="eventBox"><div class="event-icon" id="eventIcon"></div><div class="event-title" id="eventTitle"></div><div class="event-text" id="eventText"></div><button class="btn ghost" id="eventOk" type="button">知道了</button><div class="event-bar"><i id="eventBarFill"></i></div></div></section>
      <div class="sidebar-mask" id="sidebarMask" hidden></div>
      <aside class="mobile-sidebar" id="mobileSidebar" aria-label="游戏侧边栏" hidden>
        <div class="mobile-sidebar-head"><strong>对局信息</strong><button class="sidebar-close" id="sidebarClose" type="button" aria-label="收起侧边栏">›</button></div>
        <div class="sidebar-tabs"><button type="button" data-sidebar-tab="log" class="active">战报</button><button type="button" data-sidebar-tab="chat">聊天记录</button><button type="button" data-sidebar-tab="voice" id="sidebarVoiceTab" hidden>语音</button></div>
        <div class="sidebar-content" id="sidebarContent"></div>
        <div id="voiceAudio" hidden></div>
        <form class="sidebar-chat-form" id="sidebarChatForm" hidden><input id="sidebarChatInput" maxlength="500" placeholder="发言…" aria-label="聊天内容"><button type="submit">发送</button></form>
      </aside>
      <section class="entry-overlay" id="entryOverlay"><div class="entry-card"><h1>富饶之城</h1><p id="entryMessage">正在进入对局…</p></div></section>
      <section class="menu-overlay" id="menuOverlay" hidden>
        <div class="menu-card"><div class="menu-heading">菜单 <button id="menuClose" class="close" type="button">×</button></div>
        <div id="roomInfo"></div><div class="menu-options">
          <button class="btn ghost" id="menuSpeed" type="button">电脑速度 · 标准</button>
          <button class="btn ghost" id="menuRoles" type="button">角色一览</button>
          <button class="btn ghost" id="menuBuildings" type="button">建筑一览</button>
          <button class="btn ghost" id="menuRules" type="button">游戏规则</button>
          <button class="btn ghost" id="menuLog" type="button">战报</button>
          <button class="btn ghost" id="menuChat" type="button">聊天记录 / 发言</button>
          <button class="btn ghost" id="menuVoice" type="button" hidden>语音</button>
          <button class="btn ghost" id="menuTheme" type="button">切换主题</button>
          <button class="btn ghost" id="menuNewGame" type="button">离开对局并返回首页</button>
          <button class="btn ghost" id="menuCloseBottom" type="button">返回对局</button>
        </div></div>
      </section>
      <section class="reference-overlay" id="referenceOverlay" hidden aria-modal="true" role="dialog"><div class="reference-card"><div class="menu-heading"><span id="referenceTitle"></span><button id="referenceClose" class="close" type="button">×</button></div><div id="referenceBody"></div></div></section>
    </main>
  </div>
</div>

<!-- 首页 / 单人设置 / 联机大厅：与 PC 端共用同一个组件（public/components/citadels-lobby.js） -->
<c-citadels-lobby id="lobby" mode="mobile"></c-citadels-lobby>

<script src="./themes/neon/manifest.js"></script>
<script src="./themes/theme-manager.js"></script>
<script src="./src/cards.js?v=4"></script>
<script src="./mobile-theme.js?v=1"></script>
<script src="./components/citadels-lobby.js?v=5"></script>
<script src="./mobile.js?v=9"></script>
</body>
</html>
